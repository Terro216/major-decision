worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map "$status:$uri" $asset_cache {
        default "no-store";
        ~^200:/assets/ "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 4k;
        add_header Cache-Control $asset_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.ilyamedve.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://analytics.ilyamedve.dev https://www.random.org; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
